 [project]
name = "jeelsia"
version = "0.1.0"
description = "Jeelsia é uma assistente virtual em Python com base de conhecimento SQLite e pesquisa fuzzy em português."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "humanize>=4.16.0",
    "nltk>=3.10.0",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
]
